<script>
  // ===== API-LAGER: all data går via backend (server.js) =====
  const api = {
    async req(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    },
    day: date => api.req('GET', `/api/day?date=${date}&today=${today()}`),
    week: date => api.req('GET', `/api/week?date=${date}&today=${today()}`),
    overview: () => api.req('GET', `/api/overview?today=${today()}`),
    add: item => api.req('POST', '/api/items', item),
    update: (id, patch) => api.req('PATCH', `/api/items/${id}`, patch),
    remove: (id, date) => api.req('DELETE', `/api/items/${id}?today=${today()}${date ? `&date=${date}` : ''}`),
    setDone: (id, date, done) => api.req('POST', `/api/items/${id}/done`, { date, done, today: today() }),
    move: (id, from, to) => api.req('POST', `/api/items/${id}/move`, { from, to, today: today() }),
    profile: () => api.req('GET', '/api/profile'),
    setup: (name, demo) => api.req('POST', '/api/setup', { name, demo, today: today() }),
    chatLog: () => api.req('GET', '/api/chat'),
    chat: message => api.req('POST', '/api/chat', { message, today: today() }),
    clearChat: () => api.req('DELETE', '/api/chat')
  };

  // ===== RÖRELSE: fjädrar som går att avbryta. Inga bibliotek =====
  // Apples två mått: damping (1 = ingen studs) och response (hur snabbt, i sekunder).
  // En fjäder utgår alltid från sitt nuvarande läge och sin fart, så allt kan fångas mitt i rörelsen.
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const springs = new Set();
  let springClock = null;

  class Spring {
    constructor(value, { damping = 1, response = 0.4, onUpdate } = {}) {
      Object.assign(this, { value, target: value, velocity: 0, damping, response, onUpdate, onRest: null });
    }
    to(target, { velocity, damping, response, onRest } = {}) {
      if (velocity !== undefined) this.velocity = velocity;
      if (damping !== undefined) this.damping = damping;
      if (response !== undefined) this.response = response;
      this.target = target;
      this.onRest = onRest ?? null;
      if (calm.matches) return this.set(target);
      springs.add(this);
      if (springClock === null) { springClock = performance.now(); requestAnimationFrame(stepSprings); }
      return this;
    }
    set(value) {
      springs.delete(this);
      this.value = this.target = value;
      this.velocity = 0;
      this.onUpdate?.(value);
      const done = this.onRest;
      this.onRest = null;
      done?.();
      return this;
    }
    stop() { springs.delete(this); this.onRest = null; this.velocity = 0; }
  }

  function stepSprings(now) {
    const dt = Math.min((now - springClock) / 1000, 1 / 30);
    springClock = now;
    for (const s of [...springs]) {
      const w = (2 * Math.PI) / s.response;
      for (let i = 0; i < 4; i++) {
        s.velocity += (-w * w * (s.value - s.target) - 2 * s.damping * w * s.velocity) * (dt / 4);
        s.value += s.velocity * (dt / 4);
      }
      if (Math.abs(s.value - s.target) < 0.05 && Math.abs(s.velocity) < 0.5) s.set(s.target);
      else s.onUpdate?.(s.value);
    }
    if (springs.size) requestAnimationFrame(stepSprings); else springClock = null;
  }

  // Vart en svepning är på väg, inte var fingret släppte. Samma formel som scrollens inbromsning.
  const project = (velocity, rate = 0.99) => (velocity / 1000) * rate / (1 - rate);
  // Mjukt motstånd vid kanten i stället för ett hårt stopp.
  const rubberband = (over, size, c = 0.55) => (over * size * c) / (size + c * Math.abs(over));

  // CSS stänger inte av animationer som startas från skriptet, så de går alltid via play().
  const play = (el, frames, options) => (calm.matches ? null : el.animate(frames, { easing: 'cubic-bezier(.2,.9,.25,1)', ...options }));

  // Saker kommer in en i taget, uppifrån och ner: ögat får en väg att följa.
  function cascade(els, { x = 0, y = 10, gap = 32, delay = 0 } = {}) {
    [...els].slice(0, 9).forEach((el, i) => play(el,
      [{ opacity: 0, transform: `translate(${x}px, ${y}px)` }, { opacity: 1, transform: 'none' }],
      { duration: 420, delay: delay + i * gap, fill: 'backwards' }));
  }

  // Ny text glider upp på plats i stället för att bara bytas.
  function swapText(el, text) {
    const before = el.textContent;
    if (before === text) return;
    el.textContent = text;
    if (before) play(el, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 280 });
  }

  // Följer pekaren 1:1 efter 10 px, och ger upp om rörelsen går åt andra hållet (då är det scroll).
  let dragging = 0;
  function drag(e, { axis, move, end }) {
    const key = axis === 'x' ? 'clientX' : 'clientY';
    const cross = axis === 'x' ? 'clientY' : 'clientX';
    const start = e[key], startCross = e[cross];
    let active = false;
    const history = [];
    const cleanup = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
    };
    const onMove = ev => {
      const d = ev[key] - start;
      if (!active) {
        if (Math.abs(ev[cross] - startCross) > 10 && Math.abs(d) < 10) return cleanup();
        if (Math.abs(d) < 10) return;
        active = true;
        dragging++;
      }
      history.push({ d, t: ev.timeStamp });
      if (history.length > 5) history.shift();
      move(d);
    };
    const finish = cancelled => {
      cleanup();
      if (!active) return;
      dragging--;
      const a = history[0], b = history.at(-1);
      const dt = (b.t - a.t) / 1000;
      end(b.d, cancelled || !dt ? 0 : (b.d - a.d) / dt, cancelled);
      // Klicket som kommer efter en dragning ska inte öppna något.
      window.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
      setTimeout(() => window.dispatchEvent(new Event('click')), 0);
    };
    const onUp = () => finish(false);
    const onCancel = () => finish(true);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  // ===== DATUM (lokal tid, inte UTC) =====
  function localDate(offset = 0, from = new Date()) {
    const d = new Date(from);
    d.setDate(d.getDate() + offset);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  const today = () => localDate(0); // en funktion: appen kan stå öppen över midnatt
  const parseDay = date => new Date(date + 'T12:00:00');
  const shiftDate = (date, n) => localDate(n, parseDay(date));
  const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
  function fmtDay(date) {
    const d = parseDay(date);
    const label = `${DAY_SHORT[d.getDay()].toLowerCase()} ${d.getDate()} ${d.toLocaleDateString('sv-SE', { month: 'short' }).replace('.', '')}`;
    return d.getFullYear() === new Date().getFullYear() ? label : `${label} ${d.getFullYear()}`;
  }
  const fmtWeekday = date => parseDay(date).toLocaleDateString('sv-SE', { weekday: 'long' });

  function dayWord(date) {
    const diff = daysBetween(today(), date);
    return { '-1': 'Igår', 0: 'Idag', 1: 'Imorgon' }[diff] ?? fmtDay(date);
  }

  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0]; // 0 = söndag, veckan börjar på måndag
  const DAY_SHORT = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
  const DAY_LETTER = ['S', 'M', 'T', 'O', 'T', 'F', 'L'];

  function repeatLabel(repeat) {
    const key = [...repeat.days].sort().join('');
    const base = { '0123456': 'Varje dag', '12345': 'Vardagar', '06': 'Helger' }[key]
      ?? DAY_ORDER.filter(d => repeat.days.includes(d)).map(d => DAY_SHORT[d]).join(', ');
    return repeat.until ? `${base}, t.o.m. ${fmtDay(repeat.until)}` : base;
  }

  // ===== TILLSTÅND =====
  const TYPE_NAME = { routine: 'rutin', todo: 'uppgift', hobby: 'hobby', bonus: 'bonus' };
  const SLUGS = { 'screen-home': 'idag', 'screen-routines': 'rutiner', 'screen-todos': 'att-gora', 'screen-hobbies': 'hobby', 'screen-ai': 'ai' };
  const TAB_IDS = { 'screen-home': 'tab-home', 'screen-routines': 'tab-routines', 'screen-todos': 'tab-todos', 'screen-hobbies': 'tab-hobbies', 'screen-ai': 'tab-ai' };
  const SCREEN_ORDER = Object.keys(TAB_IDS);
  const CATS = ['routine', 'todo', 'hobby', 'bonus'];
  const LISTED = '.hobby-card, .week-day, .list-label, .empty, .item-row:not(.hobby-card *)'; // det som kommer in en i taget
  const icon = name => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const FAB = {
    'screen-home': ['Lägg till', 'routine'],
    'screen-routines': ['Ny rutin', 'routine'],
    'screen-todos': ['Ny uppgift', 'todo'],
    'screen-hobbies': ['Ny hobby', 'hobby']
  };

  let knownToday = today();
  let activeDate = knownToday;
  let activeScreen = 'screen-home';
  let shownScreen = null;
  let homeView = 'day';
  let fabType = 'routine';
  let profile = null;
  let day = null, week = null, overview = null; // senaste svaren från servern
  let loadError = false;
  let navDir = 0; // åt vilket håll dagen just bytte: 1 = framåt, -1 = bakåt
  const known = new Map(); // id → senast visade data, ändra-arket fylls i från den

  // Skydd mot HTML-injektion: namn kan nu komma från AI:n
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', async () => {
    buildDayPills();
    initGestures();
    readRoute();
    tick();
    setInterval(tick, 1000);
    window.addEventListener('hashchange', readRoute);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

    profile = await api.profile().catch(() => undefined); // undefined = servern svarar inte, inte "ny användare"
    if (profile === null) showSheet('setup-modal', 'setup-name');
    await Promise.all([refresh(), loadChat()]);
  });

  async function finishSetup(e, demo) {
    e.preventDefault();
    const error = document.getElementById('setup-error');
    try {
      profile = await api.setup(document.getElementById('setup-name').value, demo);
      closeSheet(true);
      renderChat([]);
      refresh();
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    }
  }

  // Körs varje sekund: klockan, midnatt och batteriet håller sig aktuella utan omladdning.
  let lastMinute = null;
  function tick() {
    const now = new Date();
    const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    document.getElementById('current-time').textContent = hhmm;

    const current = today();
    if (current !== knownToday) {
      if (activeDate === knownToday) activeDate = current; // "Idag" följer med över midnatt
      knownToday = current;
      history.replaceState(null, '', routeHash());
      refresh();
    } else if (lastMinute && hhmm !== lastMinute && !document.hidden) {
      refresh();
    }
    lastMinute = hhmm;
  }

  // Bara det senaste anropet får synas, annars kan ett långsamt svar skriva över rätt dag.
  let loadSeq = 0;
  async function refresh() {
    const seq = ++loadSeq;
    try {
      const [d, w, o] = await Promise.all([api.day(activeDate), api.week(activeDate), api.overview()]);
      if (seq !== loadSeq) return;
      day = d; week = w; overview = o;
      loadError = false;
    } catch (e) {
      if (seq !== loadSeq) return;
      loadError = true;
      console.error(e);
    }
    renderAll();
  }

  // ===== NAVIGATION: skärm och dag står i adressen, så omladdning och bakåt fungerar =====
  function routeHash() {
    if (activeScreen !== 'screen-home') return '#' + SLUGS[activeScreen];
    const view = homeView === 'week' ? 'vecka' : 'idag';
    return activeDate === today() ? `#${view}` : `#${view}/${activeDate}`;
  }

  function readRoute() {
    const [slug, date] = location.hash.slice(1).split('/');
    const screen = Object.keys(SLUGS).find(k => SLUGS[k] === slug) ?? 'screen-home';
    if (screen === 'screen-home') {
      homeView = slug === 'vecka' ? 'week' : 'day';
      activeDate = /^\d{4}-\d{2}-\d{2}$/.test(date ?? '') && !isNaN(parseDay(date)) ? date : today();
    }
    showScreen(screen);
    if (day && day.date !== activeDate) refresh(); else renderAll();
  }

  function showScreen(screenId) {
    const previous = shownScreen;
    shownScreen = screenId;
    activeScreen = screenId;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'enter'));
    const screen = document.getElementById(screenId);
    screen.classList.add('active');
    if (previous && previous !== screenId) {
      // Nästa skärm kommer från det håll fliken ligger åt
      screen.style.setProperty('--from', SCREEN_ORDER.indexOf(screenId) > SCREEN_ORDER.indexOf(previous) ? '18px' : '-18px');
      screen.classList.add('enter');
      cascade(screen.querySelectorAll(LISTED), { y: 12, delay: 40 });
      play(document.querySelector(`#${TAB_IDS[screenId]} svg`), { transform: ['scale(.78)', 'scale(1.14)', 'scale(1)'] }, { duration: 340 });
    }
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
    const tab = document.getElementById(TAB_IDS[screenId]);
    tab.classList.add('active');
    tab.setAttribute('aria-current', 'page');
    moveTabIndicator(!previous);

    const fab = document.getElementById('fab');
    fab.classList.toggle('gone', !FAB[screenId]);
    fab.inert = !FAB[screenId];
    if (FAB[screenId]) {
      document.getElementById('fab-label').textContent = FAB[screenId][0];
      fabType = FAB[screenId][1];
      fab.style.setProperty('--accent-fab', `var(--cat-${fabType})`);
    }
    if (screenId === 'screen-ai') scrollChat();
  }

  const tabSpring = new Spring(0, { damping: 0.82, response: 0.38, onUpdate: x => { document.getElementById('tab-ind').style.transform = `translateX(${x}px)`; } });
  function moveTabIndicator(instant) {
    const tab = document.getElementById(TAB_IDS[activeScreen]);
    document.getElementById('tab-ind').style.width = `${tab.offsetWidth}px`;
    if (instant) tabSpring.set(tab.offsetLeft); else tabSpring.to(tab.offsetLeft);
  }

  function switchTab(screenId) {
    activeScreen = screenId;
    location.hash = routeHash();
    showScreen(screenId);
  }

  // Idag-fliken betyder alltid idag, även om man senast tittade på en annan dag.
  function goToday() {
    activeDate = today();
    switchTab('screen-home');
    refresh();
  }

  function selectDate(date) {
    if (!date) return;
    navDir = Math.sign(daysBetween(activeDate, date));
    activeDate = date;
    history.replaceState(null, '', routeHash());
    document.getElementById('screen-home').scrollTop = 0;
    refresh();
  }

  function shiftWeek(dir) { selectDate(shiftDate(activeDate, dir * 7)); }

  function setHomeView(view) {
    if (view === homeView) return;
    homeView = view;
    history.replaceState(null, '', routeHash());
    renderHome();
    const box = document.getElementById(view === 'week' ? 'week-view' : 'day-view');
    const top = view === 'day' ? [document.getElementById('battery-card-element'), document.getElementById('date-row')] : [];
    cascade([...top, ...box.querySelectorAll(LISTED)]);
  }

  function openDay(date) {
    homeView = 'day';
    activeDate = date;
    switchTab('screen-home');
    refresh();
  }

  function openDatePicker() {
    openCalendar({ value: activeDate, onPick: selectDate });
  }

  // ===== KALENDER: alltid sex rader, så att arket inte hoppar när månaden byts =====
  const cal = { month: '', value: null, min: null, onPick: null };

  function pickerAccent(accent) {
    const device = document.getElementById('device');
    device.style.setProperty('--cal-bg', accent ? `var(--cat-${accent})` : 'var(--solid)');
    device.style.setProperty('--cal-fg', accent ? 'var(--on-cat)' : 'var(--on-solid)');
  }

  function openCalendar({ value, min = null, accent = null, onPick }) {
    Object.assign(cal, { value, min, onPick, month: (value || today()).slice(0, 7) });
    pickerAccent(accent);
    document.getElementById('cal-week').innerHTML = DAY_ORDER.map(d => `<span>${DAY_SHORT[d]}</span>`).join('');
    document.getElementById('cal-today').disabled = Boolean(min) && today() < min;
    document.getElementById('cal-tomorrow').disabled = Boolean(min) && shiftDate(today(), 1) < min;
    renderCalendar();
    showSheet('cal-modal');
  }

  function renderCalendar(dir = 0) {
    const first = `${cal.month}-01`;
    const start = shiftDate(first, -((parseDay(first).getDay() + 6) % 7));
    swapText(document.getElementById('cal-title'), parseDay(first).toLocaleDateString('sv-SE', { month: 'long', year: 'numeric' }));
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = Array.from({ length: 42 }, (_, i) => {
      const date = shiftDate(start, i);
      const classes = [date.slice(0, 7) !== cal.month && 'other', date === today() && 'today'].filter(Boolean).join(' ');
      return `<button type="button" class="cal-day ${classes}" aria-pressed="${date === cal.value}" aria-label="${esc(fmtWeekday(date))} ${esc(fmtDay(date))}" ${cal.min && date < cal.min ? 'disabled' : ''} onclick="chooseDate('${date}')">${parseDay(date).getDate()}</button>`;
    }).join('');
    if (dir) play(grid, [{ opacity: 0, transform: `translateX(${dir * 26}px)` }, { opacity: 1, transform: 'none' }], { duration: 300 });
  }

  function shiftMonth(dir) {
    const d = parseDay(`${cal.month}-01`);
    d.setMonth(d.getMonth() + dir);
    cal.month = localDate(0, d).slice(0, 7);
    renderCalendar(dir);
  }

  // Valet syns ett ögonblick innan arket stängs.
  function chooseDate(date) {
    if (cal.min && date < cal.min) return;
    cal.value = date;
    cal.month = date.slice(0, 7);
    renderCalendar();
    setTimeout(() => { closeSheet(); cal.onPick?.(date); }, calm.matches ? 0 : 150);
  }

  // ===== KLOCKA: hela urtavlan är ett enda tal, minuter sedan midnatt, som en fjäder bär =====
  // Precis som på en riktig klocka hänger visarna ihop: snurrar minuterna ett varv går timmen ett steg.
  const DIAL_C = 160, DIAL_HOUR = 96, DIAL_MIN = 128;
  const pad2 = n => String(n).padStart(2, '0');
  const mod = (n, size) => ((n % size) + size) % size;
  const hhmm = t => { const n = mod(Math.round(t), 1440); return `${pad2(Math.floor(n / 60))}:${pad2(n % 60)}`; };
  const dialSpring = new Spring(0, { damping: 0.85, response: 0.42, onUpdate: () => drawDial() });
  let dialHold = null; // minuterna står still medan timringen snurras
  const dialTime = () => hhmm(dialSpring.target);

  function dayPart(hour) {
    return hour < 5 ? 'natt' : hour < 10 ? 'morgon' : hour < 12 ? 'förmiddag' : hour < 18 ? 'eftermiddag' : 'kväll';
  }

  function buildDial() {
    const face = document.getElementById('dial-face');
    if (face.children.length) return;
    const polar = (r, turn) => [DIAL_C + Math.sin(turn * 2 * Math.PI) * r, DIAL_C - Math.cos(turn * 2 * Math.PI) * r];
    const ticks = (r, count, major) => Array.from({ length: count }, (_, i) => {
      const len = i % major ? 2 : 5;
      const [x0, y0] = polar(r - len, i / count), [x1, y1] = polar(r + len, i / count);
      return `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}`;
    }).join('');
    const labels = (r, list) => list.map((text, i) => {
      const [x, y] = polar(r, i / list.length);
      return `<text class="dial-label" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${text}</text>`;
    }).join('');
    face.innerHTML = `<circle class="dial-track" cx="${DIAL_C}" cy="${DIAL_C}" r="${DIAL_MIN}"/>
      <circle class="dial-track" cx="${DIAL_C}" cy="${DIAL_C}" r="${DIAL_HOUR}"/>
      <path class="dial-tick" d="${ticks(DIAL_MIN, 60, 5)}${ticks(DIAL_HOUR, 24, 6)}"/>
      ${labels(150, ['00', '15', '30', '45'])}${labels(72, ['00', '06', '12', '18'])}`;
  }

  function drawDial() {
    const t = dialSpring.value;
    const minute = dialHold === null ? mod(t, 60) : dialHold;
    const day = mod(t, 1440);
    const set = (key, turn, radius) => {
      document.getElementById(`dial-arc-${key}`).style.strokeDasharray = `${turn * 100} 100`;
      const knob = document.getElementById(`dial-knob-${key}`);
      knob.setAttribute('cx', DIAL_C + Math.sin(turn * 2 * Math.PI) * radius);
      knob.setAttribute('cy', DIAL_C - Math.cos(turn * 2 * Math.PI) * radius);
    };
    set('m', minute / 60, DIAL_MIN);
    set('h', day / 1440, DIAL_HOUR);
    // Under ett snurr på timringen visas timmen som landar, inte timmens delar.
    const shown = dialHold === null ? t : Math.round((t - dialHold) / 60) * 60 + dialHold;
    const text = hhmm(shown);
    const el = document.getElementById('dial-time');
    if (el.textContent === text) return;
    el.textContent = text;
    const [h, m] = text.split(':').map(Number);
    document.getElementById('dial-part').textContent = dayPart(h);
    document.getElementById('dial-knob-h').setAttribute('aria-valuenow', h);
    document.getElementById('dial-knob-m').setAttribute('aria-valuenow', m);
    if (dialDragging && (dialHold !== null || m % 5 === 0)) navigator.vibrate?.(4); // små hack, som ett riktigt reglage
  }

  function openClock(btn) {
    buildDial();
    pickerAccent(form.type);
    const [h, m] = btn.value ? btn.value.split(':').map(Number) : [];
    const now = new Date();
    // Tomt fält: börja på nästa kvart, det är oftast nära det man vill ha.
    const target = btn.value ? h * 60 + m : Math.ceil((now.getHours() * 60 + now.getMinutes()) / 15) * 15;
    dialHold = null;
    dialSpring.set(target - 150);
    showSheet('clock-modal', 'dial-knob-h');
    dialSpring.to(target, { damping: 0.82, response: 0.75 }); // klockan vrider fram sig när arket kommer upp
  }

  // Ta tag var som helst: närmaste ring följer fingret, varv efter varv.
  let dialDragging = false;
  function initDial() {
    const svg = document.getElementById('dial');
    const polar = e => {
      const r = svg.getBoundingClientRect();
      const scale = 320 / r.width;
      const x = (e.clientX - r.left) * scale - DIAL_C, y = (e.clientY - r.top) * scale - DIAL_C;
      return { angle: Math.atan2(x, -y), radius: Math.hypot(x, y) };
    };
    const shortest = a => mod(a + Math.PI, 2 * Math.PI) - Math.PI;
    let grab = null;

    svg.addEventListener('pointerdown', e => {
      if (e.button) return;
      const { angle, radius } = polar(e);
      if (radius < 62) return; // mitten är tiden, inte ett reglage
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      const ring = Math.abs(radius - DIAL_MIN) < Math.abs(radius - DIAL_HOUR) ? 'm' : 'h';
      grab = { ring, angle, start: angle, travel: 0, perTurn: ring === 'm' ? 60 : 1440, history: [] };
      dialSpring.stop();
      dialHold = ring === 'h' ? mod(Math.round(dialSpring.value), 60) : null;
      dialDragging = true;
      document.getElementById(`dial-knob-${ring}`).focus({ preventScroll: true });
    });

    svg.addEventListener('pointermove', e => {
      if (!grab) return;
      const { angle } = polar(e);
      const delta = shortest(angle - grab.angle);
      grab.angle = angle;
      grab.travel += Math.abs(delta);
      dialSpring.value += (delta / (2 * Math.PI)) * grab.perTurn;
      dialSpring.target = dialSpring.value;
      grab.history.push({ v: dialSpring.value, t: e.timeStamp });
      if (grab.history.length > 5) grab.history.shift();
      drawDial();
    });

    const release = (cancelled, at) => {
      if (!grab) return;
      const { ring, perTurn, history, travel, start } = grab;
      grab = null;
      dialDragging = false;
      let velocity = 0, landing = dialSpring.value;
      if (travel < 0.06) {
        // Ett tryck: ringen vrider sig dit fingret pekade, den korta vägen.
        const point = (mod(start, 2 * Math.PI) / (2 * Math.PI)) * perTurn;
        landing += mod(point - landing + perTurn / 2, perTurn) - perTurn / 2;
      } else if (history.length > 1 && !cancelled && at - history.at(-1).t < 80) { // stilla före släpp: ingen fart
        const a = history[0], b = history.at(-1);
        velocity = b.t > a.t ? ((b.v - a.v) / (b.t - a.t)) * 1000 : 0;
        landing += project(velocity);
      }
      // Timringen behåller minuterna. Ett snabbt snurr landar på jämna fem, ett lugnt på exakt minut.
      const snap = ring === 'h'
        ? Math.round((landing - dialHold) / 60) * 60 + dialHold
        : Math.round(landing / (Math.abs(velocity) > 40 ? 5 : 1)) * (Math.abs(velocity) > 40 ? 5 : 1);
      dialSpring.to(snap, { velocity, damping: 0.85, response: 0.42, onRest: () => { dialHold = null; } });
    };
    svg.addEventListener('pointerup', e => release(false, e.timeStamp));
    svg.addEventListener('pointercancel', e => release(true, e.timeStamp));

    // Piltangenter: samma klocka utan pekare.
    for (const [key, step] of [['h', 60], ['m', 1]]) {
      document.getElementById(`dial-knob-${key}`).addEventListener('keydown', e => {
        const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
        if (!dir) return;
        e.preventDefault();
        dialSpring.to(dialSpring.target + dir * step);
      });
    }
  }

  function finishClock(value) {
    setTimeField(value);
    closeSheet();
    syncForm(); // "Klart senast" eller "Datum" beror på om det finns en tid
  }

  function setTimeField(value) {
    const btn = document.getElementById('input-time');
    btn.value = value ?? '';
    btn.querySelector('span').textContent = value || 'Välj tid';
  }

  // Datumfälten är knappar: value fungerar som på ett input, resten av formuläret märker ingen skillnad.
  function setDateField(id, value) {
    const btn = document.getElementById(id);
    btn.value = value ?? '';
    btn.querySelector('span').textContent = value ? dayWord(value) : 'Välj datum';
  }

  function pickDate(btn) {
    const earliest = {
      'input-until': field('input-from').value,
      'input-date': form.type === 'todo' && !form.editing ? today() : null
    }[btn.id];
    openCalendar({
      value: btn.value || null,
      min: earliest || null,
      accent: form.type,
      onPick: date => setDateField(btn.id, date)
    });
  }

  // ===== RENDER =====
  // Listorna ritas inte om mitt under en svepning, då skulle raden försvinna under fingret.
  let renderHeldUntil = 0;
  function renderAll() {
    if (dragging || performance.now() < renderHeldUntil) { setTimeout(renderAll, 120); return; }
    if (day) renderBattery(day.battery, day.next);
    renderHome();
    renderRoutines();
    renderTodos();
    renderHobbies();
    renderSuggestions();
    navDir = 0;
  }

  // Skriver bara om det som ändrats. Rader med samma nyckel glider till sin nya plats, nya tonar in.
  // Är allt nytt, som vid byte av dag, kommer raderna in en i taget från det håll man gick.
  function patch(el, html) {
    if (el.dataset.html === html) return;
    const rows = root => [...root.querySelectorAll('[data-key]')];
    const before = new Map(el.offsetParent ? rows(el).map(r => [r.dataset.key, r.getBoundingClientRect().top]) : []);
    const focused = el.contains(document.activeElement) ? document.activeElement.closest('[data-key]')?.dataset.key : null;
    el.innerHTML = html;
    el.dataset.html = html;
    if (focused) el.querySelector(`[data-key="${focused}"] .check-circle`)?.focus({ preventScroll: true });
    if (calm.matches || !el.offsetParent) return;
    if (!rows(el).some(r => before.has(r.dataset.key))) return cascade(el.querySelectorAll(LISTED), { x: navDir * 18, y: navDir ? 0 : 10 });
    for (const row of rows(el)) {
      const top = before.get(row.dataset.key);
      if (top === undefined) { if (before.size) row.animate({ opacity: [0, 1] }, { duration: 220, easing: 'ease-out' }); continue; }
      const dy = top - row.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) row.animate({ transform: [`translateY(${dy}px)`, 'none'] }, { duration: 380, easing: 'cubic-bezier(.2,.9,.25,1)' });
    }
  }

  const errorHtml = () => `<div class="load-error" role="alert">Servern svarar inte. Dina saker är kvar.<button onclick="refresh()">Försök igen</button></div>`;

  function isFuture(o) {
    if (o.type === 'todo') return Boolean(o.appointment) && o.deadline > today();
    return o.date > today();
  }

  // Texten bredvid namnet: när det ska göras, inte hur datan ser ut.
  function metaHtml(o, { showDate, showDeadline }) {
    const parts = [];
    if (showDate) parts.push(dayWord(o.date));
    if (o.overdue) return `<span class="item-meta late">Försenad · ${esc(fmtDay(o.deadline))}</span>`;
    if (o.type === 'todo' && !o.done) {
      const diff = daysBetween(today(), o.deadline);
      if (o.appointment) { if (showDeadline) parts.push(dayWord(o.deadline)); }
      else parts.push(`Senast ${diff === 0 ? 'idag' : diff === 1 ? 'imorgon' : fmtDay(o.deadline)}`);
    }
    if (o.time) parts.push(o.time);
    if (o.minutes) parts.push(`${o.minutes} min`);
    const badge = o.prio === 'High' && !o.done ? '<span class="item-prio-badge">Viktig</span>' : '';
    return parts.length || badge ? `<span class="item-meta">${badge}${esc(parts.join(' · '))}</span>` : '';
  }

  function checkHtml(o) {
    const future = isFuture(o);
    const verb = o.done ? 'Ångra' : 'Bocka av';
    const onclick = future ? `toast('Det ligger i framtiden. Bocka av det på dagen.')` : `toggleDone(${Number(o.id)}, '${esc(o.date)}', this)`;
    return `<button class="check-circle ${future ? 'future' : ''}" role="checkbox" aria-checked="${Boolean(o.done)}" ${future ? 'aria-disabled="true"' : ''} aria-label="${verb}: ${esc(o.name)}" data-cat="${esc(o.type)}" style="--dot:var(--cat-${esc(o.type)})" onclick="${onclick}">
        <span class="check-dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></span>
      </button>`;
  }

  // En rad i schemat. Klick på ringen bockar av, klick på resten öppnar ändra-arket.
  function rowHtml(o, { editDate = o.date, showDate = false, showDeadline = false, next = false } = {}) {
    remember(o);
    return `<div class="item-row ${o.done ? 'done' : ''} ${next ? 'next' : ''}" data-key="${Number(o.id)}:${esc(o.date)}" style="--dot:var(--cat-${esc(o.type)})">
      ${checkHtml(o)}
      <button class="item-info" aria-label="Ändra ${esc(o.name)}" onclick="openEdit(${Number(o.id)}, ${editDate ? `'${esc(editDate)}'` : 'null'})">
        <span class="item-top">
          <span class="item-name">${esc(o.name)}</span>
          ${next ? `<span class="item-charge">+${Number(o.charge)} %</span>` : ''}
        </span>
        ${metaHtml(o, { showDate, showDeadline })}
        ${o.desc ? `<span class="item-desc">${esc(o.desc)}</span>` : ''}
      </button>
    </div>`;
  }

  function remember(o) {
    known.set(o.id, o);
    known.set(`${o.id}:${o.date}`, o);
  }

  function renderHome() {
    const isWeek = homeView === 'week';
    // Veckan handlar om planen, inte om läget just nu: den får hela skärmen.
    document.getElementById('battery-card-element').hidden = isWeek;
    document.getElementById('date-row').hidden = isWeek;
    document.getElementById('btn-week-prev').hidden = !isWeek;
    document.getElementById('btn-week-next').hidden = !isWeek;
    document.getElementById('btn-calendar').hidden = isWeek; // pilarna tar platsen, annars bryts rubriken
    document.getElementById('btn-view-day').setAttribute('aria-pressed', !isWeek);
    document.getElementById('btn-view-week').setAttribute('aria-pressed', isWeek);
    document.getElementById('day-view').hidden = isWeek;
    document.getElementById('week-view').hidden = !isWeek;
    document.getElementById('btn-go-today').hidden = activeDate === today();

    swapText(document.getElementById('day-title'), isWeek ? `v. ${weekNumber(activeDate)}` : dayWord(activeDate));
    if (week) renderStrip();
    if (loadError) {
      document.getElementById('day-count').textContent = '';
      patch(document.getElementById('day-view'), errorHtml());
      patch(document.getElementById('week-view'), errorHtml());
      return;
    }
    if (!day || !week) return;
    const planned = week.days.reduce((n, d) => n + d.total, 0);
    const doneWeek = week.days.reduce((n, d) => n + d.done, 0);
    document.getElementById('day-count').textContent = isWeek
      ? `${doneWeek} av ${planned}`
      : [dayWord(activeDate) !== fmtDay(activeDate) && fmtDay(activeDate), day.total ? `${day.done} av ${day.total}` : ''].filter(Boolean).join(' · ');
    isWeek ? renderWeekView() : renderDayView();
  }

  function weekNumber(date) {
    const d = parseDay(date);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // veckans torsdag avgör året
    const jan4 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  }

  const stripSpring = new Spring(0, { damping: 0.8, response: 0.36, onUpdate: x => { document.getElementById('strip-ind').style.transform = `translateX(${x}%)`; } });

  function renderStrip() {
    const selectedIndex = week.days.findIndex(d => d.date === activeDate);
    document.getElementById('strip-ind').hidden = selectedIndex < 0;
    if (selectedIndex >= 0) stripSpring.to(selectedIndex * 100);
    const strip = document.getElementById('week-strip');
    const fill = d => `${d.total ? Math.round((d.done / d.total) * 100) : 0}%`;
    const label = d => `${fmtWeekday(d.date)} ${parseDay(d.date).getDate()}, ${d.done} av ${d.total} klara`;
    // Samma vecka: cellerna står kvar, annars kan glaset inte stiga när något bockas av.
    if (strip.dataset.week === week.days[0].date) {
      week.days.forEach((d, i) => {
        const cell = strip.children[i];
        cell.style.setProperty('--f', fill(d));
        cell.classList.toggle('today', d.date === today());
        cell.setAttribute('aria-label', label(d));
        if (d.date === activeDate) cell.setAttribute('aria-current', 'date'); else cell.removeAttribute('aria-current');
      });
      return;
    }
    strip.dataset.week = week.days[0].date;
    strip.innerHTML = week.days.map(d => `<button class="day-cell ${d.date === today() ? 'today' : ''}" style="--f:${fill(d)}" ${d.date === activeDate ? 'aria-current="date"' : ''} aria-label="${esc(label(d))}" onclick="selectDate('${esc(d.date)}')">
        <span class="dc-wd">${esc(fmtWeekday(d.date).slice(0, 3))}</span>
        <span class="dc-num">${parseDay(d.date).getDate()}</span>
      </button>`).join('');
    cascade(strip.children, { x: navDir * 14, y: navDir ? 0 : 6, gap: 22 });
  }

  function renderDayView() {
    const open = day.items.filter(o => !o.done);
    const done = day.items.filter(o => o.done);
    const isToday = activeDate === today();
    let html = '';
    if (!day.items.length) {
      const nothingYet = isToday && !overview?.routines.length && !overview?.todos.open.length && !overview?.hobbies.length;
      html = `<p class="empty">${nothingYet ? 'Tomt än. Tryck på + för att börja.' : activeDate < today() ? 'Inget planerat.' : 'Inget planerat. Vila är också bra.'}</p>`;
    }
    if (open.length) {
      const isNext = o => isToday && day.next && o.id === day.next.id && o.date === day.next.date;
      const rows = open.map(o => ({ o, html: rowHtml(o, { next: isNext(o) }) }));
      // Nu-strecket hamnar där klockan är i dagens tidslinje. Bara för saker med klockslag.
      const now = new Date().toTimeString().slice(0, 5);
      const at = isToday ? rows.findIndex(r => r.o.time && r.o.time > now) : -1;
      const earlier = at > 0 && rows.slice(0, at).some(r => r.o.time);
      if (earlier) rows[at].html = `<div class="now-line" aria-hidden="true"><i></i><span>${now}</span></div>${rows[at].html}`;
      html += `<div class="list rail">${rows.map(r => r.html).join('')}</div>`;
    }
    if (done.length) html += `<p class="list-label">Klart</p><div class="list rail">${done.map(o => rowHtml(o)).join('')}</div>`;
    if (day.upcoming.length) {
      html += `<p class="list-label">Snart</p><div class="list rail">${day.upcoming.map(o => rowHtml(o, { showDeadline: true })).join('')}</div>`;
    }
    patch(document.getElementById('day-view'), html);
  }

  const byClock = (a, b) => (a.time ?? '99:99').localeCompare(b.time ?? '99:99'); // veckan läses i tidsordning

  function renderWeekView() {
    patch(document.getElementById('week-view'), week.days.map(d => `
      <button class="week-day ${d.date === today() ? 'today' : ''} ${d.total ? '' : 'rest'}" onclick="openDay('${esc(d.date)}')">
        <span class="week-head"><b>${esc(dayWord(d.date) === fmtDay(d.date) ? fmtDay(d.date) : `${dayWord(d.date)}, ${fmtDay(d.date)}`)}</b><span>${d.total ? `${d.done} av ${d.total}` : '–'}</span></span>
        ${[...d.items].sort(byClock).map(o => `<span class="week-item ${o.done ? 'done' : ''}" style="--c:var(--cat-${esc(o.type)})">
          ${icon(esc(o.type))}
          ${o.time ? `<span class="wi-time">${esc(o.time)}</span>` : ''}
          <span class="wi-name">${esc(o.name)}</span>
        </span>`).join('')}
      </button>`).join(''));
  }

  function dotsHtml(progress, color) {
    const words = { done: 'klart', missed: 'missat', pending: 'kvar idag', planned: 'kommer', none: 'inget planerat' };
    const summary = progress.week.map(d => `${fmtWeekday(d.date)}: ${words[d.state]}`).join(', ');
    return `<span class="dots" role="img" aria-label="Den här veckan. ${esc(summary)}" style="--c:var(${color})">${progress.week.map(d =>
      `<span class="day-dot ${esc(d.state)}">${DAY_LETTER[parseDay(d.date).getDay()]}</span>`).join('')}</span>`;
  }

  // Gjort något en dag det inte var planerat? Då ska det gå att säga det.
  function offDayCheck(o) {
    return `<button class="check-circle off-day" role="checkbox" aria-checked="false" aria-label="Gjorde det idag: ${esc(o.name)}" title="Gjorde det idag" data-cat="${esc(o.type)}" style="--dot:var(--cat-${esc(o.type)})" onclick="toggleDone(${Number(o.id)}, '${today()}', this)">
        <span class="check-dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></span>
      </button>`;
  }

  const streakText = n => (n >= 2 ? `${n} i rad` : '');

  function renderRoutines() {
    const el = document.getElementById('list-routines');
    if (loadError) { patch(el, errorHtml()); return; }
    if (!overview) return;
    if (!overview.routines.length && !overview.ended.length) {
      patch(el, `<p class="empty">Inga rutiner än.</p>`);
      return;
    }
    const active = overview.routines.map(r => {
      known.set(r.id, r);
      if (r.today) remember(r.today);
      const when = [repeatLabel(r.repeat), r.time, r.minutes && `${r.minutes} min`].filter(Boolean).join(' · ');
      return `<div class="item-row ${r.today?.done ? 'done' : ''}" data-key="r${Number(r.id)}" style="--dot:var(--cat-routine)">
        ${r.today ? checkHtml(r.today) : offDayCheck(r)}
        <button class="item-info" aria-label="Ändra ${esc(r.name)}" onclick="openEdit(${Number(r.id)}, ${r.today ? `'${esc(r.today.date)}'` : 'null'})">
          <span class="item-top">
            <span class="item-name">${esc(r.name)}</span>
            <span class="streak" style="--c:var(--cat-routine)">${streakText(r.progress.streak)}</span>
          </span>
          <span class="item-meta">${esc(when)}</span>
          ${dotsHtml(r.progress, '--cat-routine')}
        </button>
      </div>`;
    }).join('');
    const ended = overview.ended.map(r => {
      known.set(r.id, r);
      return `<div class="item-row" data-key="r${Number(r.id)}">
        <button class="item-info" style="padding-left:12px" aria-label="Ändra ${esc(r.name)}" onclick="openEdit(${Number(r.id)}, null)">
          <span class="item-name">${esc(r.name)}</span>
          <span class="item-meta">Klar ${esc(fmtDay(r.repeat.until))}: ${Number(r.sessionsDone)} av ${Number(r.sessions)} pass</span>
        </button>
      </div>`;
    }).join('');
    patch(el, active + (ended ? `<p class="list-label" style="padding-left:12px">Avslutade</p>${ended}` : ''));
  }

  function renderTodos() {
    const el = document.getElementById('list-todos');
    const sub = document.getElementById('hdr-todos-sub');
    if (loadError) { patch(el, errorHtml()); return; }
    if (!overview) return;
    const { open, done } = overview.todos;
    const late = open.filter(o => o.overdue);
    const rest = open.filter(o => !o.overdue);
    sub.textContent = open.length ? `${open.length} kvar${late.length ? ` · ${late.length} försenad${late.length > 1 ? 'e' : ''}` : ''}` : '';
    const section = (title, list) => list.length
      ? `${title ? `<p class="list-label">${title}</p>` : ''}<div class="list">${list.map(o => rowHtml({ ...o, date: o.done ? o.date : today() }, { editDate: null, showDeadline: true })).join('')}</div>`
      : '';
    patch(el, (open.length || done.length)
      ? section(late.length ? 'Försenade' : '', late) + section(late.length ? 'Kommande' : '', rest) + section('Klara', done)
      : `<p class="empty">Inget att göra.</p>`);
  }

  function renderHobbies() {
    const el = document.getElementById('list-hobbies');
    const bonus = document.getElementById('list-bonus');
    if (loadError) { patch(el, errorHtml()); patch(bonus, ''); return; }
    if (!overview) return;
    patch(el, overview.hobbies.length
      ? overview.hobbies.map(h => {
        const p = h.progress;
        return `<article class="hobby-card">
          <div class="hobby-head"><h2>${esc(h.name)}</h2><span class="streak">${streakText(p.streak)}</span></div>
          <p class="hobby-sub">${p.weekDone} av ${p.weekPlanned} pass${p.weekMinutes ? ` · ${p.weekMinutes} min` : ''}</p>
          ${dotsHtml(p, '--cat-hobby')}
          ${h.next ? `<div class="hobby-next">${rowHtml(h.next, { showDate: true })}</div>` : ''}
          ${h.offDay ? `<div class="hobby-next"><div class="item-row" data-key="h${Number(h.offDay.id)}" style="--dot:var(--cat-hobby)">${offDayCheck(h.offDay)}<span class="item-info"><span class="item-meta">Gjorde det idag ändå</span></span></div></div>` : ''}
        </article>`;
      }).join('')
      : `<p class="empty" style="padding-left:0">Ingen hobby än.</p>`);
    patch(bonus, overview.bonus.length
      ? overview.bonus.map(o => rowHtml(o)).join('')
      : `<p class="empty" style="padding:0 6px 10px">Inget idag.</p>`);
  }

  // ===== BOCKA AV =====
  function ringInView() {
    if (activeScreen !== 'screen-home' || homeView !== 'day') return false;
    const r = document.getElementById('ring').getBoundingClientRect();
    return r.bottom > document.querySelector('.screen-container').getBoundingClientRect().top + 40;
  }

  // En liten komet från bocken till slutet av kategorins båge. Syns inte ringen säger ön vad som hände.
  function flyToRing(btn) {
    const color = getComputedStyle(btn).getPropertyValue('--dot');
    if (calm.matches || !ringInView()) return;
    const device = document.getElementById('device').getBoundingClientRect();
    const from = btn.getBoundingClientRect();
    const to = ringPoint(btn.dataset.cat);
    const x0 = from.left + from.width / 2 - device.left, y0 = from.top + from.height / 2 - device.top;
    const x1 = to.x - device.left, y1 = to.y - device.top;
    renderHeldUntil = performance.now() + 520; // nivån stiger när färgen når fram, inte före
    [1, 0.7, 0.45].forEach((size, i) => {
      const dot = document.createElement('div');
      dot.className = 'fly';
      dot.style.setProperty('--c', color);
      document.getElementById('device').appendChild(dot);
      const flight = dot.animate([
        { transform: `translate(${x0}px, ${y0}px) scale(${0.6 * size})`, opacity: 0.4 },
        { transform: `translate(${(x0 + x1) / 2 + 34}px, ${(y0 + y1) / 2 - 18}px) scale(${1.1 * size})`, opacity: 1, offset: 0.5 },
        { transform: `translate(${x1}px, ${y1}px) scale(${0.5 * size})`, opacity: 1 }
      ], { duration: 440, delay: i * 36, fill: 'backwards', easing: 'cubic-bezier(.45,0,.3,1)' });
      flight.onfinish = () => { dot.remove(); if (i === 0) ringPulse(color); };
    });
  }

  // Optimistisk uppdatering: UI ändras direkt, servern sparar i bakgrunden.
  const pendingTicks = new Set();
  async function toggleDone(id, date, btn) {
    const key = `${id}:${date}`;
    if (pendingTicks.has(key)) return;
    pendingTicks.add(key);
    const row = btn.closest('.item-row');
    const done = !row.classList.contains('done');
    row.classList.toggle('done', done);
    btn.setAttribute('aria-checked', done);
    if (done) {
      const color = getComputedStyle(btn).getPropertyValue('--dot');
      play(btn.querySelector('.check-dot'), {
        transform: ['scale(.7)', 'scale(1.18)', 'scale(1)'],
        boxShadow: [`0 0 0 0 ${color}`, '0 0 0 12px transparent']
      }, { duration: 420 });
      flyToRing(btn);
      navigator.vibrate?.(10);
    }
    try {
      const { battery, gained, covered } = await api.setDone(id, date, done);
      if (done) {
        const swap = covered ? ` · passet ${dayWord(covered).toLowerCase()}` : '';
        toast(`${gained > 0 ? `+${gained} %` : 'Klart'}${swap}`, {
          label: 'Ångra',
          run: async () => {
            await api.setDone(id, date, false).catch(err => toast('Kunde inte ångra: ' + err.message, { error: true }));
            refresh();
          }
        });
      }
    } catch (e) {
      row.classList.toggle('done', !done); // rulla tillbaka om servern misslyckas
      btn.setAttribute('aria-checked', !done);
      toast('Kunde inte spara: ' + e.message, { error: true });
    }
    pendingTicks.delete(key);
    refresh();
  }

  // ===== BATTERI =====
  // När tar det slut, i ord. "Tisdag kväll" går att förstå direkt, det gör inte 12:57:36.
  function emptyWords(iso) {
    const at = new Date(iso);
    const diff = daysBetween(today(), localDate(0, at));
    const hour = at.getHours();
    if (hour < 5) return diff <= 1 ? 'i natt' : `natten mot ${fmtWeekday(localDate(0, at))}`;
    const part = hour < 10 ? 'morgon' : hour < 13 ? 'förmiddag' : hour < 18 ? 'eftermiddag' : 'kväll';
    if (diff === 0) return { eftermiddag: 'i eftermiddag', kväll: 'ikväll' }[part] ?? `ca kl ${String(hour).padStart(2, '0')}`;
    if (diff === 1) return part === 'morgon' ? 'imorgon bitti' : `imorgon ${part}`;
    return `${fmtWeekday(localDate(0, at))} ${part}`;
  }

  function leftWords(b) {
    if (!b.level) return { val: 'Tomt', lab: 'Bocka av något för att ladda' };
    const h = b.hoursLeft;
    const val = h < 1 ? 'Räcker under en timme'
      : h < 24 ? `Räcker ca ${Math.round(h)} h`
      : `Räcker ca ${String(Math.round(h / 12) / 2).replace('.', ',')} dygn`;
    return { val, lab: `till ${emptyWords(b.emptyAt)}` };
  }

  function renderBattery(b, next) {
    const words = leftWords(b);
    const first = !document.getElementById('battery-time-left').textContent;
    swapText(document.getElementById('battery-time-left'), words.val);
    swapText(document.getElementById('battery-time-lab'), words.lab);
    if (first) cascade(document.querySelectorAll('.t-val, .t-lab, .hero-cat'), { x: -8, y: 0, gap: 40, delay: 120 });
    for (const t of CATS) document.getElementById(`bat-${t}`).textContent = b.byType[t];
    setRing(b, first);
    let state;
    if (next) state = `Nästa: ${next.name}${next.time ? ` kl ${next.time}` : ''} ger +${next.charge} %`;
    else if (day?.todayTotal) state = 'Allt klart för idag. Bra jobbat!';
    else state = 'Inget planerat idag.';
    document.getElementById('battery-card-element').setAttribute('aria-label', `Batteri ${b.level} procent. ${words.val} ${words.lab}. ${state}. Visa hur batteriet funkar.`);
  }

  // ===== RINGEN: en båge per kategori i samma ordning som i batteriet, en procent är en procent av varvet =====
  const RING_GAP = 1; // mellanrum mellan bågarna, i procent av varvet
  const RING_CAP = 1.4; // de runda ändarna sticker ut så här långt
  const ringSegs = Object.fromEntries(CATS.map(t => [t, new Spring(0, { damping: 0.9, response: 0.7, onUpdate: () => drawRing() })]));
  const ringKick = new Spring(0, { damping: 0.42, response: 0.5, onUpdate: k => { document.getElementById('ring').style.transform = `scale(${1 + k * 0.001})`; } });

  function drawRing() {
    let at = 0;
    for (const t of CATS) {
      const value = Math.max(0, ringSegs[t].value);
      const length = Math.max(0.01, value - RING_GAP - 2 * RING_CAP); // små bågar blir en rund prick
      const seg = document.getElementById(`seg-${t}`);
      seg.style.strokeDasharray = `${length} 100`;
      seg.style.strokeDashoffset = -(at + (value - length) / 2);
      seg.style.opacity = value < 0.3 ? 0 : 1;
      document.getElementById(`leg-${t}`).textContent = Math.round(value);
      at += value;
    }
    document.getElementById('ring-val').textContent = Math.round(at);
  }

  // Vid start ritas ringen långsamt, efter det är den snabb.
  function setRing(b, first) {
    const response = first ? 1.1 : 0.7;
    for (const t of CATS) ringSegs[t].to(b.byType[t], { response });
  }

  // Var på skärmen kategorins båge slutar.
  function ringPoint(cat) {
    const ends = CATS.slice(0, CATS.indexOf(cat) + 1).reduce((sum, t) => sum + ringSegs[t].value, 0);
    const r = document.getElementById('ring').getBoundingClientRect();
    const angle = (ends / 100) * 2 * Math.PI;
    const radius = (86 / 200) * r.width;
    return { x: r.left + r.width / 2 + Math.sin(angle) * radius, y: r.top + r.height / 2 - Math.cos(angle) * radius };
  }

  // Ringen tar emot laddningen: en liten stöt och en våg som går ut från den.
  function ringPulse(color) {
    if (calm.matches) return;
    ringKick.velocity += 700;
    ringKick.to(0);
    const halo = document.getElementById('ring-halo');
    halo.style.stroke = color;
    play(halo, { transform: ['scale(1)', 'scale(1.16)'], opacity: [0.55, 0] }, { duration: 620 });
  }

  const radarSpring = new Spring(0, { damping: 0.78, response: 0.55, onUpdate: () => drawRadar() });
  let radarData = null;

  function renderRadar(b) {
    radarData = b;
    radarSpring.stop();
    radarSpring.value = 0;
    radarSpring.to(1);
    drawRadar();
    const label = k => (b[k] === null ? '–' : `${b[k]}%`);
    for (const k of CATS) {
      document.getElementById(`radar-lbl-${k}`).textContent = label(k);
      document.getElementById(`node-${k}`).style.display = b[k] === null ? 'none' : ''; // ingen plan, inget värde att visa
    }
    document.getElementById('balance-svg').setAttribute('aria-label',
      `Livsbalans senaste 7 dagarna: rutiner ${label('routine')}, att göra ${label('todo')}, hobby ${label('hobby')}, bonus ${label('bonus')}`);
  }

  function drawRadar() {
    const b = radarData;
    const v = k => (b[k] ?? 0) / 100 * Math.max(0, radarSpring.value);
    const ry = 125 - v('routine') * 80;
    const tx = 140 + v('todo') * 88;
    const hy = 125 + v('hobby') * 80;
    const bx = 140 - v('bonus') * 88;
    document.getElementById('radar-polygon').setAttribute('points', `140,${ry} ${tx},125 140,${hy} ${bx},125`);
    document.getElementById('node-routine').setAttribute('cy', ry);
    document.getElementById('node-todo').setAttribute('cx', tx);
    document.getElementById('node-hobby').setAttribute('cy', hy);
    document.getElementById('node-bonus').setAttribute('cx', bx);
  }

  function openBatterySheet() {
    const rate = day?.battery.drainPerHour ?? 1;
    const fullDays = Math.round(100 / rate / 24);
    document.getElementById('battery-explain').innerHTML =
      `Visar <b>hur du håller din plan</b>, inte hur du mår. Längre pass laddar mer. Sjunker ${String(rate).replace('.', ',')} % i timmen, fullt räcker ca ${fullDays} dygn.`;
    showSheet('battery-modal');
    if (overview) renderRadar(overview.balance);
  }

  // ===== ARK: fokus stannar i arket, Escape stänger och fokus går tillbaka efteråt =====
  let openSheetEl = null;
  let returnFocus = null;

  // Varje ark har sin fjäder: öppnas det igen medan det stängs vänder det från där det är.
  const sheetSprings = new Map();
  function sheetSpring(overlay) {
    if (!sheetSprings.has(overlay)) {
      const sheet = overlay.querySelector('.modal-sheet');
      sheetSprings.set(overlay, new Spring(1000, {
        onUpdate: y => {
          const p = Math.max(0, Math.min(1, 1 - y / (sheet.offsetHeight || 1)));
          sheet.style.transform = `translateY(${y}px)`;
          overlay.style.setProperty('--p', p);
          if (!overlay.dataset.nested) document.getElementById('device').style.setProperty('--sheet', p);
        }
      }));
    }
    return sheetSprings.get(overlay);
  }

  // Kalendern kan öppnas ovanpå formuläret: det undre arket väntar och tar över när den stängs.
  const sheetStack = [];

  function showSheet(id, focusId) {
    const next = document.getElementById(id);
    if (openSheetEl && openSheetEl !== next) sheetStack.push({ el: openSheetEl, focus: returnFocus });
    if (sheetStack.length) next.dataset.nested = '1'; else delete next.dataset.nested;
    openSheetEl = next;
    returnFocus = document.activeElement;
    const spring = sheetSpring(openSheetEl);
    if (!openSheetEl.classList.contains('active')) {
      openSheetEl.classList.add('active');
      spring.value = spring.target = openSheetEl.querySelector('.modal-sheet').offsetHeight;
      spring.velocity = 0;
      const parts = [...openSheetEl.querySelector('.modal-sheet').children].filter(el => !el.matches('.sheet-grip') && el.offsetParent);
      cascade(parts, { y: 16, gap: 26, delay: 70 });
    }
    spring.to(0, { damping: 0.92, response: 0.38 });
    const target = focusId ? document.getElementById(focusId) : openSheetEl.querySelector('button, input');
    target?.focus({ preventScroll: true });
  }

  function closeSheet(force, velocity = 0) {
    if (!openSheetEl || (openSheetEl.dataset.locked && !force)) return;
    const overlay = openSheetEl;
    const under = sheetStack.pop();
    openSheetEl = under?.el ?? null;
    sheetSpring(overlay).to(overlay.querySelector('.modal-sheet').offsetHeight, {
      velocity, damping: 1, response: 0.3,
      onRest: () => overlay.classList.remove('active')
    });
    returnFocus?.focus?.({ preventScroll: true });
    returnFocus = under?.focus ?? null;
  }

  function closeSheetOnOverlay(e) { if (e.target.classList.contains('modal-overlay')) closeSheet(); }

  document.addEventListener('keydown', e => {
    if (!openSheetEl) return;
    if (e.key === 'Escape') return closeSheet();
    if (e.key !== 'Tab') return;
    const focusable = [...openSheetEl.querySelectorAll('button, input, textarea, [tabindex="0"]')].filter(el => !el.disabled && el.offsetParent !== null);
    const first = focusable[0], last = focusable.at(-1);
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // ===== GESTER: allt här går också med vanliga knappar =====
  function initGestures() {
    window.addEventListener('resize', () => moveTabIndicator(true));
    initDial();

    // Svep kalendern för att byta månad.
    document.getElementById('cal-grid').addEventListener('pointerdown', e => {
      if (e.button) return;
      drag(e, { axis: 'x', move() {}, end(d, velocity, cancelled) {
        if (!cancelled && Math.abs(d + project(velocity)) > 60) shiftMonth(d < 0 ? 1 : -1);
      } });
    });

    // Svep en rad åt höger för att bocka av. Fingret bestämmer, släpper man med fart bakåt händer inget.
    document.addEventListener('pointerdown', e => {
      const row = e.target.closest('.item-row');
      const check = row?.querySelector('.check-circle');
      if (!check || e.button) return;
      const tickable = !check.classList.contains('future');
      const width = row.offsetWidth;
      const spring = new Spring(0, { onUpdate: x => row.style.setProperty('--x', `${x}px`) });
      drag(e, {
        axis: 'x',
        move(d) {
          const x = d > 0 && tickable ? d : rubberband(d, width, 0.2);
          spring.stop();
          spring.value = x;
          spring.onUpdate(x);
        },
        end(d, velocity, cancelled) {
          const commit = tickable && !cancelled && velocity >= 0 && d + project(velocity) > width * 0.45;
          renderHeldUntil = Math.max(renderHeldUntil, performance.now() + 420);
          if (commit) check.click();
          spring.to(0, { velocity, damping: 0.85, response: 0.32 });
        }
      });
    });

    // Svep veckoremsan för att byta vecka.
    const wrap = document.getElementById('week-wrap');
    const stripDrag = new Spring(0, { damping: 0.85, response: 0.32, onUpdate: x => { wrap.style.transform = `translateX(${x}px)`; } });
    wrap.addEventListener('pointerdown', e => {
      if (e.button) return;
      drag(e, {
        axis: 'x',
        move(d) { stripDrag.stop(); stripDrag.value = rubberband(d, wrap.offsetWidth, 0.7); stripDrag.onUpdate(stripDrag.value); },
        end(d, velocity, cancelled) {
          const landing = d + project(velocity);
          if (!cancelled && Math.abs(landing) > wrap.offsetWidth * 0.3 && Math.sign(velocity || d) === Math.sign(landing)) shiftWeek(landing < 0 ? 1 : -1);
          stripDrag.to(0, { velocity });
        }
      });
    });

    // Dra ner ett ark i greppet. Farten avgör om det stängs, och den följer med in i rörelsen.
    document.addEventListener('pointerdown', e => {
      const grip = e.target.closest('.sheet-grip');
      if (!grip || e.button || e.target.closest('button')) return;
      const overlay = grip.closest('.modal-overlay');
      const sheet = overlay.querySelector('.modal-sheet');
      const spring = sheetSpring(overlay);
      const from = spring.value;
      drag(e, {
        axis: 'y',
        move(d) {
          const y = from + d;
          spring.stop();
          spring.value = y > 0 && !overlay.dataset.locked ? y : rubberband(y, sheet.offsetHeight, 0.35);
          spring.onUpdate(spring.value);
        },
        end(d, velocity) {
          if (!overlay.dataset.locked && velocity >= 0 && spring.value + project(velocity) > sheet.offsetHeight * 0.5) closeSheet(false, velocity);
          else spring.to(0, { velocity, damping: 0.8, response: 0.3 });
        }
      });
    });
  }

  // ===== LÄGG TILL / ÄNDRA: samma formulär, fälten följer vad som läggs till =====
  const FORM = {
    routine: { placeholder: 'Gym' },
    todo: { placeholder: 'Lämna in uppsats' },
    hobby: { placeholder: 'Gitarr' },
    bonus: { placeholder: 'Promenad' }
  };

  let form = { type: 'routine', repeating: true, days: [], prio: 'Medium', editing: null, occurrence: null };

  function buildDayPills() {
    document.getElementById('day-pills').innerHTML = DAY_ORDER.map(d =>
      `<button type="button" class="day-pill" data-day="${d}" aria-label="${DAY_SHORT[d]}" onclick="toggleDay(${d})">${DAY_LETTER[d]}</button>`).join('');
  }

  const field = id => document.getElementById(id);
  const startDate = () => (activeScreen === 'screen-home' && activeDate > today() ? activeDate : today());

  function isRepeating() {
    if (form.type === 'routine') return true;
    return form.type !== 'todo' && form.repeating;
  }

  function syncForm() {
    const repeating = isRepeating();
    const { placeholder } = FORM[form.type];
    document.querySelectorAll('.type-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === form.type));
    field('type-group').hidden = Boolean(form.editing);
    field('item-form').style.setProperty('--c', `var(--cat-${form.type})`);
    field('input-title').placeholder = placeholder;
    field('group-freq').hidden = form.type === 'routine' || form.type === 'todo';
    field('freq-once').setAttribute('aria-pressed', !repeating);
    field('freq-repeat').setAttribute('aria-pressed', repeating);
    field('group-date').hidden = repeating;
    field('label-date').textContent = form.type === 'todo' && !field('input-time').value ? 'Klart senast' : 'Datum';
    field('group-repeat').hidden = !repeating;
    field('group-period').hidden = !field('input-period').checked;
    document.querySelectorAll('.day-pill').forEach(b => b.setAttribute('aria-pressed', form.days.includes(Number(b.dataset.day))));
    document.querySelectorAll('.prio-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.prio === form.prio));
  }

  function setType(type) {
    form.type = type;
    if (!form.editing) form.repeating = type === 'routine' || type === 'hobby';
    syncForm();
  }
  function setRepeating(on) { form.repeating = on; syncForm(); }
  function setDays(days) { form.days = [...days]; syncForm(); }
  // Är alla på väljer första trycket just den dagen, annars skulle "gym måndag" stänga av måndagen.
  function toggleDay(d) {
    if (form.days.length === 7) form.days = [d];
    else form.days = form.days.includes(d) ? form.days.filter(x => x !== d) : [...form.days, d];
    syncForm();
  }
  function setPrio(prio) { form.prio = prio; syncForm(); }

  function toggleMore(open) {
    const group = field('group-more');
    group.hidden = open === undefined ? !group.hidden : !open;
    field('btn-more').setAttribute('aria-expanded', !group.hidden);
  }

  function showFormError(message, focusId) {
    const el = field('form-error');
    el.textContent = message;
    el.hidden = !message;
    if (focusId) field(focusId).focus();
  }

  function fillForm(values) {
    field('input-title').value = values.name ?? '';
    field('input-desc').value = values.desc ?? '';
    setTimeField(values.time);
    field('input-minutes').value = values.minutes ?? '';
    setDateField('input-date', values.date);
    setDateField('input-from', values.from);
    setDateField('input-until', values.until);
    field('input-period').checked = Boolean(values.until);
    field('session-box').hidden = true;
    field('edit-scope').hidden = true;
    field('move-row').hidden = true;
    showFormError('');
  }

  function openModal(type) {
    form = { type, repeating: type === 'routine' || type === 'hobby', days: [0, 1, 2, 3, 4, 5, 6], prio: 'Medium', editing: null, occurrence: null };
    const date = activeDate >= today() ? activeDate : today();
    fillForm({ date, from: startDate() });
    field('modal-title').textContent = 'Lägg till';
    field('btn-save').textContent = 'Spara';
    toggleMore(false);
    renderDeleteArea();
    syncForm();
    showSheet('add-modal', 'input-title');
  }

  function openEdit(id, occurrenceDate) {
    const o = known.get(`${id}:${occurrenceDate}`) ?? known.get(id);
    if (!o) return;
    const start = o.start ?? o.date;
    form = {
      type: o.type,
      repeating: Boolean(o.repeat),
      days: o.repeat?.days ?? [0, 1, 2, 3, 4, 5, 6],
      prio: o.prio,
      editing: { id, start, name: o.name, type: o.type, repeat: o.repeat },
      occurrence: occurrenceDate
    };
    fillForm({ ...o, date: o.deadline ?? start, from: start, until: o.repeat?.until });
    field('modal-title').textContent = `Ändra ${TYPE_NAME[o.type]}`;
    field('btn-save').textContent = 'Spara ändringar';
    toggleMore(Boolean(o.desc) || o.prio !== 'Medium');
    renderDeleteArea();
    syncForm();
    if (o.repeat) {
      field('edit-scope').hidden = false;
      // Bara ett pass som inte är gjort än går att flytta eller hoppa över.
      if (occurrenceDate && !o.done) {
        field('session-box').hidden = false;
        field('session-title').textContent = `Bara passet ${dayWord(occurrenceDate).toLowerCase()}:`;
      }
    }
    showSheet('add-modal', 'input-title');
  }

  function showMove() {
    field('move-row').hidden = false;
    setDateField('input-move', shiftDate(form.occurrence, 1));
    field('input-move').focus();
  }

  async function moveSession() {
    const to = field('input-move').value;
    if (!to) return showFormError('Välj en dag.', 'input-move');
    const { id, name } = form.editing;
    try {
      await api.move(id, form.occurrence, to);
    } catch (err) {
      return showFormError(err.message);
    }
    closeSheet();
    await refresh();
    toast(`${name} flyttad till ${dayWord(to).toLowerCase()}`, to === activeDate ? {} : { label: 'Visa', run: () => openDay(to) });
  }

  function readForm() {
    const name = field('input-title').value.trim();
    if (!name) return showFormError('Skriv ett namn.', 'input-title');

    const minutesRaw = field('input-minutes').value.trim();
    const minutes = minutesRaw === '' ? null : Number(minutesRaw);
    if (field('input-minutes').validity.badInput || (minutes !== null && (!Number.isInteger(minutes) || minutes < 1 || minutes > 600))) {
      return showFormError('Minuter ska vara ett heltal mellan 1 och 600.', 'input-minutes');
    }

    const repeating = isRepeating();
    let date = field('input-date').value;
    let repeat = null;
    if (repeating) {
      if (!form.days.length) return showFormError('Välj minst en dag.');
      const period = field('input-period').checked;
      const until = period ? field('input-until').value : '';
      date = period ? field('input-from').value : (form.editing?.start ?? startDate());
      if (period && !date) return showFormError('Välj när perioden börjar.', 'input-from');
      if (period && !until) return showFormError('Välj när perioden slutar.', 'input-until');
      if (period && until < date) return showFormError('Perioden kan inte sluta innan den börjar.', 'input-until');
      repeat = { days: form.days, until: until || null };
    } else if (!date) {
      return showFormError(form.type === 'todo' ? 'Välj när det ska vara klart.' : 'Välj ett datum.', 'input-date');
    } else if (form.type === 'todo' && !form.editing && date < today()) {
      return showFormError('Det datumet har redan varit.', 'input-date');
    }

    return {
      name,
      desc: field('input-desc').value.trim(),
      date,
      time: field('input-time').value || null,
      minutes,
      prio: form.prio,
      repeat
    };
  }

  async function saveItem(e) {
    e.preventDefault();
    const item = readForm();
    if (!item) return;
    const editing = form.editing;
    try {
      if (editing) await api.update(editing.id, item);
      else await api.add({ ...item, type: form.type });
    } catch (err) {
      return showFormError('Kunde inte spara: ' + err.message);
    }
    closeSheet();
    await refresh();
    // Hamnar det på en annan dag än den som visas ska det inte se ut som att inget hände.
    const where = item.repeat ? repeatLabel(item.repeat) : dayWord(item.date).toLowerCase();
    const elsewhere = !item.repeat && activeScreen === 'screen-home' && item.date !== activeDate;
    toast(`${item.name} · ${where}`, elsewhere ? { label: 'Visa', run: () => openDay(item.date) } : {});
  }

  function renderDeleteArea(step) {
    const area = field('delete-area');
    const editing = form.editing;
    if (!editing) { area.innerHTML = ''; return; }
    if (step !== 'ask') {
      area.innerHTML = `<button type="button" class="btn-secondary btn-danger" onclick="renderDeleteArea('ask')">Ta bort</button>`;
      return;
    }
    area.innerHTML = `<div class="delete-ask">
      <p>Ta bort ${esc(editing.name)}${editing.repeat ? ' helt, alla pass framåt' : ''}? Det du redan gjort räknas fortfarande.</p>
      <button type="button" class="btn-secondary btn-danger" onclick="confirmDelete(null)">Ja, ta bort</button>
      <button type="button" class="btn-secondary" onclick="renderDeleteArea()">Avbryt</button>
    </div>`;
    area.querySelector('button').focus();
  }

  // Eget funktionsnamn: i en onclick inne i ett <form> betyder "form" formulärelementet, inte variabeln.
  function skipSession() { confirmDelete(form.occurrence); }

  async function confirmDelete(date) {
    const { id, name } = form.editing;
    try {
      await api.remove(id, date);
    } catch (err) {
      return showFormError('Kunde inte ta bort: ' + err.message);
    }
    closeSheet();
    refresh();
    toast(date ? `${name} borttagen ${dayWord(date).toLowerCase()}` : `${name} borttagen`);
  }

  // ===== TOAST: kort besked där man är =====
  let toastTimer = null;
  const toastSpring = new Spring(0, { damping: 0.74, response: 0.42, onUpdate: p => {
    const el = document.getElementById('toast');
    el.style.opacity = Math.min(1, Math.max(0, p * 1.6));
    el.style.transform = `translateX(-50%) scale(${0.5 + 0.5 * p})`;
  } });

  function hideToast() {
    document.getElementById('toast').classList.remove('show');
    toastSpring.to(0, { damping: 1, response: 0.28 });
  }

  function toast(message, { label, run, error } = {}) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('error', Boolean(error));
    if (label) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.onclick = () => { hideToast(); run(); };
      el.appendChild(btn);
    }
    el.classList.add('show');
    toastSpring.to(1, { damping: 0.74, response: 0.42 });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, label ? 5000 : 2800);
  }

  // ===== DREAM AI: riktig agent via /api/chat. Samtalet ligger på servern =====
  function addBubble(role, text) {
    const chatBody = document.getElementById('ai-chat-body');
    const el = document.createElement('div');
    el.className = `chat-msg ${role}`;
    el.textContent = text;
    chatBody.appendChild(el);
    scrollChat();
    return el;
  }

  function scrollChat() {
    const chatBody = document.getElementById('ai-chat-body');
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // Varje handling agenten gjorde visas som ett kort → användaren ser exakt vad som ändrats.
  // Samma sak flera gånger blir ett kort, så att svaret inte drunknar.
  function addActionCards(actions) {
    if (!actions?.length) return;
    const labels = { add: 'La till', done: 'Bockade av', undone: 'Ångrade', update: 'Ändrade', delete: 'Tog bort', skip: 'Tog bort en dag', move: 'Flyttade', notes: 'Planerade' };
    const icons = { add: '+', done: '✓', undone: '↺', update: '✎', delete: '×', skip: '×', move: '→', notes: '✎' };
    const groups = new Map();
    for (const a of actions) {
      const key = `${a.kind}:${a.item.name}`;
      if (!groups.has(key)) groups.set(key, { ...a, count: 0 });
      groups.get(key).count++;
    }
    const chatBody = document.getElementById('ai-chat-body');
    const wrap = document.createElement('div');
    wrap.className = 'action-list';
    for (const a of groups.values()) {
      const oneDay = ['done', 'undone', 'skip', 'move'].includes(a.kind);
      const when = a.item.repeat && !oneDay ? repeatLabel(a.item.repeat) : a.count > 1 ? `${a.count} dagar` : fmtDay(a.item.date);
      const card = document.createElement('button');
      card.className = `action-card ${a.kind}`;
      card.style.setProperty('--c', `var(--cat-${a.item.type})`);
      card.innerHTML = `<span class="action-ic">${icons[a.kind]}</span>
        <span class="action-txt"><b>${labels[a.kind]}:</b> ${esc(a.item.name)}</span>
        <span class="action-date">${esc(when)}</span>`;
      card.onclick = () => openDay(a.item.repeat && a.kind !== 'move' ? today() : a.item.date);
      wrap.appendChild(card);
    }
    chatBody.appendChild(wrap);
    scrollChat();
    return wrap;
  }

  function renderChat(messages) {
    document.getElementById('ai-chat-body').innerHTML = '';
    document.getElementById('btn-new-chat').hidden = !messages.length;
    if (!messages.length) {
      const empty = document.createElement('div');
      empty.className = 'ai-empty';
      empty.id = 'ai-empty';
      document.getElementById('ai-chat-body').appendChild(empty);
      renderSuggestions(true);
    }
    for (const m of messages) {
      addActionCards(m.actions);
      addBubble(m.role, m.content);
    }
  }

  // Förslagen utgår från hur dagen ser ut just nu, så att första frågan bara är ett tryck bort.
  function suggestions() {
    const list = [];
    if (day?.next) list.push(`Flytta ${day.next.name} till imorgon`);
    const hobby = overview?.hobbies[0];
    list.push(hobby ? `Gör en veckoplan för ${hobby.name.toLowerCase()}` : 'Hjälp mig planera veckan');
    list.push('Hur går det den här veckan?');
    return list;
  }

  function renderSuggestions(force) {
    const empty = document.getElementById('ai-empty');
    if (!empty) return;
    const html = `<h2>${profile?.name ? `Hej ${esc(profile.name)}` : 'Hej'}</h2>` + suggestions().map(s => `<button class="suggest" onclick="askAi(this.textContent)">${esc(s)}</button>`).join('');
    if (force || empty.dataset.html !== html) { empty.innerHTML = html; empty.dataset.html = html; }
  }

  function askAi(text) {
    document.getElementById('ai-input').value = text;
    sendAiMsg();
  }

  async function loadChat() {
    renderChat(await api.chatLog().catch(() => []));
  }

  async function clearChat() {
    await api.clearChat();
    renderChat([]);
  }

  let aiBusy = false;
  async function sendAiMsg() {
    const input = document.getElementById('ai-input');
    const text = input.value.trim();
    if (!text || aiBusy) return;
    aiBusy = true;
    input.value = '';
    document.getElementById('ai-empty')?.remove();
    document.getElementById('btn-new-chat').hidden = false;
    addBubble('user', text).classList.add('fresh');

    const typing = addBubble('assistant', '');
    typing.classList.add('typing', 'fresh');
    typing.setAttribute('aria-label', 'Dream AI tänker');
    typing.innerHTML = '<i></i><i></i><i></i>';

    try {
      const { reply, actions } = await api.chat(text);
      typing.remove();
      cascade(addActionCards(actions)?.children ?? [], { y: 8 }); // korten först: det är svaret man ska läsa sist
      addBubble('assistant', reply).classList.add('fresh');
      if (actions?.length) refresh(); // live-uppdatera batteri och listor
    } catch (e) {
      typing.remove();
      addBubble('assistant', 'Oj, något gick fel: ' + e.message);
      input.value = text; // låt användaren försöka igen
    } finally {
      aiBusy = false;
    }
  }
</script>
</body>
</html>
